[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenbar-continuity-camera-mount"
version = "0.1.0"
description = "Parametric build123d mount for an iPhone on a BenQ ScreenBar Halo 2 rear plate"
requires-python = ">=3.10,<3.15"
dependencies = [
    "build123d>=0.11,<0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["screenbar_mount*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
